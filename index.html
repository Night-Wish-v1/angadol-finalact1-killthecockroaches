<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kill the Cockroach</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Landing Page -->
  <div id="landing-page">
    <h1>Welcome to Kill the Cockroach!</h1>
    <p>Get ready to smash some cockroaches. Click the button below to start the game.<br>
    Made by Joshua Angadol</p>
    <button id="start-btn">Start Game</button>
  </div>

  <!-- Game UI and elements -->
  <div id="offline">No Internet Connection</div>
  
  <div id="ui">
    <span>Time: <span id="timer">0</span>s</span>
    <span>Kills: <span id="kills">0</span></span>
    <span>Level: <span id="level">1</span></span>
    <button id="mute-btn">Mute</button>
  </div>

  <div id="game-container"></div>

  <!-- Speeding Up Message -->
  <div id="level-up-message">Speeding Up!</div>

  <!-- Background Music -->
  <audio id="bg-music" loop>
    <source src="Background.mp3" type="audio/mpeg" />
  </audio>
  
  <!-- Smash Sound -->
  <audio id="smash-sound">
    <source src="table-smash.mp3" type="audio/mpeg" />
  </audio>

  <script src="script.js"></script>
</body>
</html>
